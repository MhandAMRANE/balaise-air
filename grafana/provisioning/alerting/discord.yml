# Alerte Discord + e-mail : un message quand la qualité de l'air devient Poor.
# Les secrets (webhook Discord, adresse e-mail) viennent du fichier .env.
apiVersion: 1

# 0. Le texte du message, écrit une seule fois pour Discord et pour l'e-mail.
#    Une ligne par cause envoyée par la balise (air, temperature, humidite).
templates:
  - orgId: 1
    name: balise
    template: |-
      {{ define "balise.message" -}}
      Attention, la qualité de l'air dans la pièce est mauvaise.
      {{ range .Alerts.Firing -}}
      {{ if match "air" .Labels.cause }}• L'air est pollué (fumée, parfum, produits ménagers…)
      {{ end -}}
      {{ if match "temperature" .Labels.cause }}• La température n'est pas confortable
      {{ end -}}
      {{ if match "humidite" .Labels.cause }}• L'humidité n'est pas bonne
      {{ end -}}
      {{ end -}}
      Pensez à aérer la pièce.
      {{- end }}

# 1. Où envoyer : le salon Discord et la boîte mail
contactPoints:
  - orgId: 1
    name: Discord balise
    receivers:
      - uid: discord-balise
        type: discord
        disableResolveMessage: true          # rien quand l'air redevient bon
        settings:
          url: ${DISCORD_WEBHOOK_URL}
          title: "⚠️ Qualité de l'air : mauvaise"
          message: '{{ template "balise.message" . }}'
      - uid: email-balise
        type: email
        disableResolveMessage: true          # rien quand l'air redevient bon
        settings:
          addresses: ${ALERT_EMAIL_TO}
          subject: "⚠️ Qualité de l'air : mauvaise"
          message: '{{ template "balise.message" . }}'

# 2. Le rythme des envois
policies:
  - orgId: 1
    receiver: Discord balise
    group_by: ['alertname']
    group_wait: 10s           # attendre 10 s avant le premier message
    group_interval: 1m        # au moins 1 min avant un nouveau message (si la cause change)
    repeat_interval: 24h      # rappel au plus une fois par jour si l'air reste Poor

# 3. La règle : vérifiée toutes les 20 s, alerte si la dernière mesure est Poor
groups:
  - orgId: 1
    name: balise
    folder: Balise
    interval: 20s
    rules:
      - uid: balise-etat-poor
        title: Qualité de l'air mauvaise
        condition: C
        data:
          # A : la dernière mesure des 2 dernières minutes (1 si Poor, 0 sinon)
          - refId: A
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: balise-pg
            model:
              refId: A
              format: table
              rawQuery: true
              rawSql: >-
                SELECT CASE WHEN etat = 'Poor' THEN 1 ELSE 0 END AS poor, cause
                FROM mesures
                WHERE date_heure AT TIME ZONE 'Europe/Paris' > now() - interval '2 minutes'
                ORDER BY id DESC LIMIT 1
          # C : alerte si poor > 0.5, c'est-à-dire si poor vaut 1
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.5]
        noDataState: OK           # pas de mesure récente (balise arrêtée) : pas d'alerte
        execErrState: KeepLast    # base injoignable : on garde l'état précédent
        for: 0s                   # obligatoire : alerte dès la première mesure Poor
