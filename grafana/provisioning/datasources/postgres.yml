# Source de données PostgreSQL créée automatiquement au démarrage de Grafana.
# L'hôte est "postgres" (le nom du service Docker), pas localhost.
apiVersion: 1

datasources:
  - name: PostgreSQL balise
    uid: balise-pg
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: balise
    isDefault: true
    editable: true
    jsonData:
      database: balise
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
